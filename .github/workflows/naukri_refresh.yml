name: Naukri Profile Refresh

on:
  workflow_dispatch:  # triggered by cron-job.org every hour (0 2-17 UTC = 7:30AM-10:30PM IST)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show run time (IST)
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST: $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Ubuntu runners usually already include Chrome
      - name: Verify Chrome
        run: google-chrome --version || chromium-browser --version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Naukri bot
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python naukri_bot/bot_chrome.py

      - name: Commit refreshed cookies
        if: always()
        run: |
          git config user.name "naukri-bot"
          git config user.email "naukri-bot@users.noreply.github.com"

          if [[ -f naukri_bot/naukri_cookies.json ]]; then
            git add naukri_bot/naukri_cookies.json

            if ! git diff --staged --quiet; then
              git commit -m "chore: refresh session cookies [skip ci]"
              git push
            else
              echo "No cookie changes"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
