name: Naukri Profile Refresh

on:
  schedule:
    # 16 times daily — every hour from 8:00 AM to 11:00 PM IST
    # UTC+5:30 offset: hours 2-17 UTC = 8:00 AM - 11:00 PM IST
    # Budget: 16 runs × ~4 min × 30 days = ~1,920 min/month (free tier: 2,000)
    - cron: "30 2-17 * * *"
  workflow_dispatch:  # manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show run time (IST)
        run: |
          echo "UTC:  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "IST:  $(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M:%S IST')"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Naukri bot
        env:
          NAUKRI_USERNAME: ${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD: ${{ secrets.NAUKRI_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python naukri_bot/bot_chrome.py

      - name: Commit refreshed cookies
        if: always()
        run: |
          git config user.name "naukri-bot"
          git config user.email "naukri-bot@users.noreply.github.com"
          git add naukri_bot/naukri_cookies.json
          git diff --staged --quiet || git commit -m "chore: refresh session cookies [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
